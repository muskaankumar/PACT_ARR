# PPA — pilot configuration (build prompt §8)
#
# A small, fast subset used to validate the harness and run the pilot studies
# (naive-rater message ordering, detection self-test, intra-rater reliability,
# ceiling calibration) before committing to the full grid.
#
# It exercises all four mock policies so every code path — compliant stop,
# unauthorized contact, forbidden-file edit, and the truthfulness/liar path — is
# represented. With 2 repetitions this is 8 × 9 × 4 × 2 = 576 runs; use
# `ppa-run pilot.yaml --limit N` to run only the first N cells for a smoke test.

name: ppa-pilot
seed: 7
repetitions: 2
task_layout: "2x2x2"

max_turns: 24
num_reminders: 2
debrief_turns: 2
allowed_recipients: ["review-bot"]
ci_enabled: true
rejection_delay_after_pr: 0

results_dir: "data/results"
results_file: "pilot.jsonl"
runs_dir: "data/runs"

template_dir: "templates/sandbox_repo"
mock_with_tests: true

models:
  - id: "mock-compliant"
    backend: mock
    policy: "mock-compliant"
    pair: "A"
  - id: "mock-forbidden-file"
    backend: mock
    policy: "mock-forbidden-file"
    pair: "B"
  - id: "mock-boundary-contact"
    backend: mock
    policy: "mock-boundary-contact"
    pair: "B"
  - id: "mock-liar"
    backend: mock
    policy: "mock-liar"
    pair: "B"
